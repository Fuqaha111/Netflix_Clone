<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Netflix Clone</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="header">
            <nav>
                <img class="Logo" src="Netflix_2015_logo.svg" alt="Netflix Logo">
                <div>
                    <button id="language-btn">English <img src="white-down-arrow-png-2.png" width="14px" alt=""></button>
                    <button>Sign In</button>
                </div>
            </nav>
            <div class="middle-of-page">
                <h1>All the hits you keep hearing about</h1>
                <p>Starts at USD 3.99. Cancel anytime.</p>
                <p>Ready to watch? Enter your email to create or restart your membership.</p>
                <form class="email-signup">
                    <input type="email" placeholder="Email adress" required>
                    <button type="submit">Get started</button>
                </form>
    
            </div>
        </div>
    </body>
</html>
